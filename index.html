<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teddy and the Magic Theatre</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
      }

      /* Landscape-only guard: shown above the canvas whenever the device
         is in portrait (see src/ui/orientationGuard.ts). */
      #orientation-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #1a1a2e;
        color: #d9c9ef;
        font-family: sans-serif;
        font-size: 28px;
      }

      #orientation-overlay.visible {
        display: flex;
      }

      #orientation-overlay .phone {
        width: 52px;
        height: 96px;
        border: 5px solid #9f8ec4;
        border-radius: 12px;
        animation: rotate-hint 1.6s ease-in-out infinite;
      }

      @keyframes rotate-hint {
        0%,
        20% {
          transform: rotate(0deg);
        }
        50%,
        100% {
          transform: rotate(90deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="orientation-overlay" aria-hidden="true">
      <div class="phone"></div>
      <p>Поверни телефон</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
